<div class="modal fade" id="logModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="logTitle">版本详情</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="logContent" class="small"></div>
            </div>
            <div class="modal-footer">
                <a id="logDownload" href="#" class="btn btn-rw btn-sm w-100">立即下载</a>
            </div>
        </div>
    </div>
</div>

<button id="backTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fa fa-arrow-up"></i>
</button>

<script src="https://cdn.staticfile.org/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<script>
    let allVersions = [];

    // 1. 初始化并从 JSON 加载数据
    async function init() {
        try {
            const response = await fetch('versions.json?t=' + new Date().getTime());
            allVersions = await response.json();
            renderTable(allVersions);
        } catch (error) {
            console.error("加载失败:", error);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">无法加载版本数据，请检查 versions.json 文件。</td></tr>';
        }
    }

    // 2. 渲染表格数据 (仅修改了跳转 download.html 的逻辑)
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">未找到相关版本</td></tr>';
            return;
        }

        data.forEach((item, index) => {
            let badgeColor = 'bg-secondary';
            // 保持原本的 badge 逻辑
            if (item.type.includes('原版')) badgeColor = 'bg-success';
            if (item.type.includes('测试')) badgeColor = 'bg-warning text-dark'; // 适配你的数据
            if (item.type.includes('MOD')) badgeColor = 'bg-warning text-dark';

            let row = `
                <tr>
                    <td><a href="javascript:void(0)" class="ver-link" onclick="showLog(${index})"><b>${item.version}</b></a></td>
                    <td><span class="badge ${badgeColor}">${item.type}</span></td>
                    <td class="mobile-hide">${item.date}</td>
                    <td>${item.size}</td>
                    <td><i class="fa fa-info-circle text-primary"></i> ${item.status}</td>
                    <td><a href="download.html?v=${encodeURIComponent(item.version)}" class="btn btn-rw btn-sm">详情</a></td>
                </tr>`;
            tbody.innerHTML += row;
        });
    }

    // 3. 搜索功能实现 (保持原样)
    function searchVersion() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allVersions.filter(item => 
            item.version.toLowerCase().includes(keyword) || 
            item.type.toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    // 4. 显示更新日志弹窗 (保持原样，点击下载改为跳转详情)
    function showLog(index) {
        const item = allVersions[index];
        document.getElementById('logTitle').innerText = item.version + " 简报";
        document.getElementById('logContent').innerText = item.logs || "暂无该版本的详细更新说明。";
        // 修改：弹窗内的下载也引导至详情页，以便用户看密码
        document.getElementById('logDownload').href = "download.html?v=" + encodeURIComponent(item.version);
        
        const myModal = new bootstrap.Modal(document.getElementById('logModal'));
        myModal.show();
    }

    // 分享功能 (保持原样)
    function copyShare() {
        const text = "铁锈战争全版本资源站，apk不限速下载！链接：" + window.location.href;
        navigator.clipboard.writeText(text).then(() => alert("分享链接已复制到剪贴板！"));
    }

    // 回到顶部 (保持原样)
    window.onscroll = function() {
        let btn = document.getElementById("backTop");
        if (document.documentElement.scrollTop > 300) {
            btn.style.display = "flex";
        } else {
            btn.style.display = "none";
        }
    };

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchVersion();
    });

    init();
</script>

</body>
