<script src="https://cdn.staticfile.org/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<script>
    let allVersions = [];

    async function init() {
        try {
            const response = await fetch('versions.json?t=' + new Date().getTime());
            allVersions = await response.json();
            renderTable(allVersions);
        } catch (error) {
            console.error("加载失败:", error);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">无法加载版本数据</td></tr>';
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">未找到相关版本</td></tr>';
            return;
        }

        let lastMajor = ""; 
        data.forEach((item, index) => {
            const currentMajor = item.version.substring(0, 4); 
            if (lastMajor !== currentMajor && lastMajor !== "") {
                tbody.innerHTML += `
                    <tr class="table-light">
                        <td colspan="6" class="small fw-bold text-muted py-1 ps-3" style="background:#f8f9fa">
                            <i class="fa fa-folder-open-o"></i> ${currentMajor} 时代版本
                        </td>
                    </tr>`;
            }
            lastMajor = currentMajor;

            let versionDisplay = `<b>${item.version}</b>`;
            let latestTag = "";

            if (item.version === "v1.15" && item.type === "正式版") {
                latestTag = `<span class="badge rounded-pill badge-new mb-1"><i class="fa fa-bolt"></i> 最新版</span><br>`;
                versionDisplay = `<b class="text-danger" style="font-size: 1.1rem;">${item.version}</b>`;
            }

            let badgeColor = 'bg-secondary';
            if (item.type.includes('正式')) badgeColor = 'bg-success';
            if (item.type.includes('测试')) badgeColor = 'bg-warning text-dark';
            if (item.type.includes('修订') || item.type.includes('修复')) badgeColor = 'bg-info text-dark';
            if (item.type.includes('Alpha')) badgeColor = 'bg-dark';

            let row = `
                <tr>
                    <td>
                        ${latestTag}
                        <a href="javascript:void(0)" class="ver-link" onclick="showLog(${index})">${versionDisplay}</a>
                    </td>
                    <td><span class="badge ${badgeColor}">${item.type}</span></td>
                    <td class="mobile-hide">${item.date}</td>
                    <td>${item.size}</td>
                    <td><i class="fa fa-info-circle text-primary"></i> ${item.status}</td>
                    <td><a href="download.html?v=${encodeURIComponent(item.version)}" class="btn btn-rw btn-sm">详情</a></td>
                </tr>`;
            tbody.innerHTML += row;
        });
    }

    function searchVersion() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allVersions.filter(item => 
            item.version.toLowerCase().includes(keyword) || 
            item.type.toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    function showLog(index) {
        const item = allVersions[index];
        document.getElementById('logTitle').innerText = item.version + " 简报";
        document.getElementById('logContent').innerText = item.logs || "暂无该版本的详细更新说明。";
        document.getElementById('logDownload').href = "download.html?v=" + encodeURIComponent(item.version);
        const myModal = new bootstrap.Modal(document.getElementById('logModal'));
        myModal.show();
    }

    function copyShare() {
        const text = "铁锈战争全版本资源站，apk不限速下载！链接：" + window.location.href;
        navigator.clipboard.writeText(text).then(() => alert("分享链接已复制到剪贴板！"));
    }

    window.onscroll = function() {
        let btn = document.getElementById("backTop");
        if (btn) btn.style.display = (document.documentElement.scrollTop > 300) ? "flex" : "none";
    };

    document.getElementById('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchVersion(); });
    init();
</script>
