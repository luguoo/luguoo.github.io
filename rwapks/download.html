<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>资源载入中 - RWAPKS</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #f39c12; --bg: #f4f7f6; }
        body { background-color: var(--bg); font-family: sans-serif; }
        .sticky-top { background: #fff; border-bottom: 2px solid var(--primary-color); }
        .rdbox { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #fff; }
        .btn-rw { background: var(--primary-color); color: white; border-radius: 10px; font-weight: 700; padding: 12px; transition: 0.3s; }
        .btn-rw:hover { background: var(--accent-color); color: white; transform: translateY(-3px); }
        .alert-rw { border-left: 5px solid var(--accent-color); background: #fff; border-radius: 10px; }
        .line-card { border: 1px solid #eee; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .line-card:hover { border-color: var(--accent-color); background: #fffdf9; }
        .zoom-anim { animation: pulse 2s infinite; }
        @keyframes pulse { 0% {transform:scale(1)} 50% {transform:scale(1.02)} 100% {transform:scale(1)} }
    </style>
</head>
<body>

<nav class="sticky-top py-2 mb-4">
    <div class="container d-flex align-items-center">
        <a href="index.html" class="text-decoration-none text-dark fw-bold"><i class="fa fa-arrow-left"></i> 返回列表</a>
    </div>
</nav>

<div class="container">
    <div class="mb-4">
        <span class="badge bg-success p-2 px-3" id="v-type">--</span>
        <h2 class="fw-bold mt-2" id="v-title">Rusted Warfare</h2>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card rdbox p-4 mb-4">
                <div class="d-flex align-items-center mb-3">
                    <img src="https://rustedwarfare.org/icon.png" width="70" class="rounded-3 shadow-sm me-3">
                    <div>
                        <div class="h5 m-0 fw-bold" id="v-info-name">--</div>
                        <small class="text-muted" id="v-info-size">大小：--</small>
                    </div>
                </div>
                <div class="alert alert-rw py-2 mb-0">
                    <i class="fa fa-key me-2"></i> <b id="v-pwd">提取密码：--</b>
                    <button class="btn btn-sm btn-link text-decoration-none" onclick="copyPwd()">点击复制</button>
                </div>
            </div>

            <h5><i class="fa fa-download text-warning me-2"></i>获取作战资源</h5>
            <div class="d-grid gap-3 mb-4">
                <button class="btn btn-rw btn-lg shadow zoom-anim" onclick="goDownload()">
                    <i class="fa fa-cloud-download"></i> 立即通过蓝奏云下载
                </button>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card rdbox p-3 mb-4">
                <h6 class="fw-bold"><i class="fa fa-shield me-2"></i>安装提示</h6>
                <ul class="small text-muted ps-3 mb-0">
                    <li>安卓11+用户建议覆盖安装</li>
                    <li>若报毒请选择“忽略并继续”</li>
                    <li>请在24小时内删除，支持正版</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUrl = "";
    let currentPwd = "";

    async function loadDetail() {
        const ver = new URLSearchParams(window.location.search).get('v');
        if(!ver) { window.location.href="index.html"; return; }

        const res = await fetch('versions.json');
        const data = await res.json();
        const info = data.find(i => i.version === ver);

        if(info) {
            document.title = info.version + " 下载 - RWAPKS";
            document.getElementById('v-type').innerText = info.type;
            document.getElementById('v-title').innerText = "版本详情：" + info.version;
            document.getElementById('v-info-name').innerText = "铁锈战争 " + info.version;
            document.getElementById('v-info-size').innerText = "更新日期：" + info.date + " | 大小：" + info.size;
            
            currentPwd = info.status.replace("提取码: ", "").trim();
            document.getElementById('v-pwd').innerText = "提取密码：" + currentPwd;
            currentUrl = info.url;
        }
    }

    function copyPwd() {
        navigator.clipboard.writeText(currentPwd);
        alert("密码 " + currentPwd + " 已复制！");
    }

    function goDownload() {
        copyPwd();
        setTimeout(() => { window.open(currentUrl, '_blank'); }, 500);
    }
    loadDetail();
</script>
</body>
</html>
