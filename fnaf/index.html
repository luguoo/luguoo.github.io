<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNaF资源仓库｜官方+同人</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #050505; }
        .fnaf-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #1f2937; position: relative; }
        .fnaf-card:hover { transform: translateY(-5px); border-color: #ca8a04; box-shadow: 0 0 20px rgba(202, 138, 4, 0.3); }
        .tab-active { border-bottom: 2px solid #ca8a04; color: #ca8a04; }
        .bg-fnaf { background: linear-gradient(to bottom, #000000, #0a0a0a); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ca8a04; }
    </style>
</head>
<body class="text-gray-200" x-data="{ tab: 'pc' }">

    <nav class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black italic tracking-tighter text-yellow-600">FNaF.backup</span>
            </div>
            <div class="flex gap-4 md:gap-8 text-xs md:text-sm">
                <button @click="tab = 'pc'" :class="tab === 'pc' ? 'tab-active' : 'text-gray-500'" class="pb-1 font-bold transition uppercase">Windows</button>
                <button @click="tab = 'android'" :class="tab === 'android' ? 'tab-active' : 'text-gray-500'" class="pb-1 font-bold transition uppercase">Android</button>
                <button @click="tab = 'ios'" :class="tab === 'ios' ? 'tab-active' : 'text-gray-500'" class="pb-1 font-bold transition uppercase">iOS</button>
            </div>
        </div>
    </nav>

    <header class="py-12 bg-fnaf text-center border-b border-white/5 px-4">
        <h1 class="text-3xl font-bold tracking-widest text-white mb-2 italic">Five Nights at Freddy's</h1>
        <p class="text-gray-500 text-xs tracking-[0.3em] uppercase">玩具熊的五夜后宫全系列 持续收录ing…</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        
        <div x-show="tab === 'pc'" x-transition class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="game in [
                {n:'安全漏洞', d:'Security Breach', l:'https://www.123865.com/s/3NwrVv-TtWmH', hot:true},
                {n:'陷入球池', d:'Into the Pit', l:'https://www.123865.com/s/3NwrVv-jeWmH', hot:true},
                {n:'Help Wanted', d:'PC 完整版', l:'https://www.123865.com/s/3NwrVv-yeWmH'},
                {n:'Help Wanted 2', d:'PC 完整版', l:'https://www.123865.com/s/3NwrVv-VeWmH'},
                {n:'FNaF 1', d:'Classic Edition', l:'https://www.123865.com/s/3NwrVv-eeWmH'},
                {n:'FNaF 2', d:'Classic Edition', l:'https://www.123865.com/s/3NwrVv-teWmH'},
                {n:'FNaF 3', d:'Classic Edition', l:'https://www.123865.com/s/3NwrVv-ieWmH'},
                {n:'FNaF 4', d:'Classic Edition', l:'https://www.123865.com/s/3NwrVv-zeWmH'},
                {n:'FNaF 5', d:'Sister Location', l:'https://www.123865.com/s/3NwrVv-LeWmH'},
                {n:'FNaF 6', d:'Pizzeria Simulator', l:'https://www.123865.com/s/3NwrVv-5eWmH'},
                {n:'FNaF UCN', d:'Ultimate Custom Night', l:'https://www.123865.com/s/3NwrVv-qeWmH'},
                {n:'FNaF World', d:'Adventure Edition', l:'https://www.123865.com/s/3NwrVv-6eWmH'}
            ]">
                <div class="fnaf-card bg-[#111] p-6 rounded-lg flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <div class="text-yellow-700 text-[10px] font-bold uppercase tracking-widest">Windows</div>
                            <template x-if="game.hot">
                                <span class="bg-red-600 text-white text-[8px] px-1.5 py-0.5 rounded font-bold">NEW</span>
                            </template>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2" x-text="game.n"></h3>
                        <p class="text-gray-500 text-xs mb-6 h-8 line-clamp-2" x-text="game.d"></p>
                    </div>
                    <a :href="game.l" target="_blank" class="block text-center py-2 bg-yellow-600 hover:bg-yellow-500 text-black font-bold rounded transition text-sm">下载 PC 版</a>
                </div>
            </template>
        </div>

        <div x-show="tab === 'android'" x-transition class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="game in [
                {n:'FNaF 1', l:'https://www.123865.com/s/3NwrVv-UeWmH'},
                {n:'FNaF 2', l:'https://www.123865.com/s/3NwrVv-SeWmH'},
                {n:'FNaF 3', l:'https://www.123865.com/s/3NwrVv-leWmH'},
                {n:'FNaF 4', l:'https://www.123865.com/s/3NwrVv-7eWmH'},
                {n:'FNaF 5', l:'https://www.123865.com/s/3NwrVv-beWmH'},
                {n:'FNaF 6', l:'https://www.123865.com/s/3NwrVv-ZeWmH'},
                {n:'UCN', l:'https://www.123865.com/s/3NwrVv-ceWmH'}
            ]">
                <div class="fnaf-card bg-[#111] p-6 rounded-lg flex flex-col justify-between border-blue-900/20">
                    <div>
                        <div class="text-blue-500 text-[10px] font-bold mb-1 uppercase tracking-widest">Android</div>
                        <h3 class="text-xl font-bold text-white mb-2" x-text="game.n"></h3>
                        <p class="text-gray-500 text-xs mb-6">手机端 APK</p>
                    </div>
                    <a :href="game.l" target="_blank" class="block text-center py-2 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded transition text-sm">下载 APK</a>
                </div>
            </template>
        </div>

        <div x-show="tab === 'ios'" x-transition class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="game in [
                {n:'FNaF 1', l:'https://www.123865.com/s/3NwrVv-dtWmH'},
                {n:'FNaF 2', l:'https://www.123865.com/s/3NwrVv-3tWmH'},
                {n:'FNaF 3', l:'https://www.123865.com/s/3NwrVv-htWmH'},
                {n:'FNaF 4', l:'https://www.123865.com/s/3NwrVv-HtWmH'},
                {n:'FNaF 5', l:'https://www.123865.com/s/3NwrVv-AtWmH'},
                {n:'FNaF 6', l:'https://www.123865.com/s/3NwrVv-9tWmH'},
                {n:'FNaF UCN', l:'https://www.123865.com/s/3NwrVv-QtWmH'},
                {n:'FNaF HW', l:'https://www.123865.com/s/3NwrVv-EtWmH'}
            ]">
                <div class="fnaf-card bg-[#111] p-6 rounded-lg flex flex-col justify-between border-emerald-900/20">
                    <div>
                        <div class="text-emerald-500 text-[10px] font-bold mb-1 uppercase tracking-widest">iOS</div>
                        <h3 class="text-xl font-bold text-white mb-2" x-text="game.n"></h3>
                        <p class="text-gray-500 text-xs mb-6">iPhone / iPad 资源</p>
                    </div>
                    <a :href="game.l" target="_blank" class="block text-center py-2 bg-emerald-700 hover:bg-emerald-600 text-white font-bold rounded transition text-sm">下载 IPA</a>
                </div>
            </template>
        </div>

    </main>

    <footer class="py-10 border-t border-white/5 text-center bg-black px-4">
        <p class="text-gray-600 text-xs tracking-widest uppercase">Fazbear Security Network</p>
        <p class="text-gray-800 text-[10px] mt-2 italic uppercase">End of communication.</p>
    </footer>

</body>
</html>
