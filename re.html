                if (keyword !== '') {
                    sectionEl.classList.add('active');
                }
                
                const headerEl = document.createElement('div');
                headerEl.className = 'section-header';
                headerEl.onclick = () => sectionEl.classList.toggle('active');
                
                headerEl.innerHTML = `
                    <div class="section-title">
                        ${section.category}
                        <span class="video-count">${filteredVideos.length}</span>
                    </div>
                    <div class="toggle-icon">▼</div>
                `;
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'section-content';
                
                const gridEl = document.createElement('div');
                gridEl.className = 'video-grid';
                
                filteredVideos.forEach(video => {
                    const a = document.createElement('a');
                    a.href = video.url;
                    a.className = 'video-item';
                    a.target = '_blank';
                    a.innerHTML = `<div class="video-title">${video.name}</div>`;
                    gridEl.appendChild(a);
                });

                contentWrapper.appendChild(gridEl);
                sectionEl.appendChild(headerEl);
                sectionEl.appendChild(contentWrapper);
                contentArea.appendChild(sectionEl);
            }
        });
    }

    searchInput.addEventListener('input', (e) => render(e.target.value));
    render();
</script>

</body>
</html>
